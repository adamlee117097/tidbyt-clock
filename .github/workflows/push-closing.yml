name: Push Kaleidoscope closing card to Tidbyt

# The countdown changes once a day, at local midnight, and nothing else on
# the card depends on the time. Two runs a day: 05:17 UTC is just after
# midnight in New York in both EDT and EST (04:xx would be 11pm the night
# before once the clocks go back on 11/1), and GitHub fires free-tier cron
# hours late, so the 11:17 run is the backstop that still lands before the
# 8am open. Shop device only.
on:
  schedule:
    - cron: "17 5,11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keepalive
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/push-closing.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      # Cached, so most runs never touch GitHub's release server; retried with
      # backoff, because one bad download (504s, 11/8-11/9) failed whole runs;
      # checked against the release checksum, because this binary gets device tokens.
      - name: Cache pixlet
        uses: actions/cache@v4
        with:
          path: pixlet.tgz
          key: pixlet-0.34.0-linux-amd64

      - name: Install pixlet
        run: |
          if ! echo "5833d0711803dd6374e696a5d02462f766b299df6413486021fb4035dcc54640  pixlet.tgz" | sha256sum -c - 2>/dev/null; then
            curl -fsSL --retry 8 --retry-all-errors --connect-timeout 20 -o pixlet.tgz https://github.com/tidbyt/pixlet/releases/download/v0.34.0/pixlet_0.34.0_linux_amd64.tar.gz
            echo "5833d0711803dd6374e696a5d02462f766b299df6413486021fb4035dcc54640  pixlet.tgz" | sha256sum -c -
          fi
          tar xzf pixlet.tgz pixlet

      - name: Render and push
        run: |
          ./pixlet render closing/closing.star -o closing.webp
          ./pixlet push \
            --api-token "${{ secrets.TIDBYT_API_TOKEN }}" \
            --installation-id closing \
            "${{ secrets.TIDBYT_DEVICE_ID }}" closing.webp
