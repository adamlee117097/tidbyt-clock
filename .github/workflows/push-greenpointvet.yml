name: Push Greenpoint Vet card to friend's Tidbyt

# Pushes to a FRIEND's Tidbyt (Greenpoint Veterinary Hospital, 145 Nassau),
# using the FRIEND_TIDBYT_* secrets -- not Adam's device.
#
# The card is open/closed aware (dog and cat awake 10am-7pm, asleep after),
# and a pushed WebP is frozen until replaced, so the push cadence is what
# keeps it accurate. GitHub throttles free-tier cron to roughly every 1-3
# hours, so like the logo workflow each run keeps itself alive for ~5.5h
# pushing every 15 minutes, and the next scheduled run queues behind it
# (cancel-in-progress must stay false).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: push-greenpointvet
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # Runs FIRST so a later render/push failure can't skip it: this is what
      # stops GitHub auto-disabling the schedule after 60 days.
      - name: Keepalive
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/push-greenpointvet.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install pixlet
        run: curl -sL https://github.com/tidbyt/pixlet/releases/download/v0.34.0/pixlet_0.34.0_linux_amd64.tar.gz | tar xz

      # One transient failure must not kill the remaining iterations -- the
      # next scheduled run can be hours away. On a render failure, re-push the
      # previous webp so the device at least keeps showing something.
      - name: Render and push every 15 minutes
        run: |
          for i in $(seq 1 22); do
            if ./pixlet render greenpointvet/greenpointvet.star -o fresh.webp; then
              mv fresh.webp vet.webp
            else
              echo "render $i FAILED, reusing previous webp"
            fi
            if [ -f vet.webp ]; then
              ./pixlet push \
                --api-token "${{ secrets.FRIEND_TIDBYT_API_TOKEN }}" \
                --installation-id greenpointvet \
                "${{ secrets.FRIEND_TIDBYT_DEVICE_ID }}" vet.webp \
                && echo "push $i OK $(date -u +%H:%M)" \
                || echo "push $i FAILED"
            fi
            if [ "$i" -lt 22 ]; then sleep 900; fi
          done
