name: Push Greenpoint Vet card to friend's Tidbyt

# Pushes to a FRIEND's Tidbyt (Greenpoint Veterinary Hospital, 145 Nassau),
# using the FRIEND_TIDBYT_* secrets -- not Adam's device.
#
# The card is open/closed aware (dog and cat awake 10am-7pm, asleep after),
# changes scene every 15 minutes, and dresses for holidays and live weather,
# and a pushed WebP is frozen until replaced, so the push cadence is what
# keeps it accurate. GitHub fires free-tier cron 1-9 hours late, so each run
# keeps itself alive for ~5.5h pushing every 15 minutes and, like the news
# workflow, queues its own successor once a push has gone through; cron only
# restarts a broken chain. Before 11/9 it waited on cron alone and the card
# sat frozen 10% of the time, in gaps of up to 4 hours.
# cancel-in-progress must stay false.
#
# To stop it: disable the workflow AND cancel the running and pending runs
# (Keepalive re-enables it at the start of every run).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      passes:
        description: "Push iterations (1 = quick test run with a readable log)"
        default: "22"

permissions:
  contents: read
  actions: write

concurrency:
  group: push-greenpointvet
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7

      # Runs FIRST so a later render/push failure can't skip it: this is what
      # stops GitHub auto-disabling the schedule after 60 days.
      - name: Keepalive
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/push-greenpointvet.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      # make_frames.py composes the frames for the current moment (scene by
      # time, holiday by date, live NWS weather) and needs Pillow.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      # Cached, so most runs never touch GitHub's release server; retried with
      # backoff, because one bad download (504s, 11/8-11/9) failed whole runs;
      # checked against the release checksum, because this binary gets device tokens.
      - name: Cache pixlet
        uses: actions/cache@v6
        with:
          path: pixlet.tgz
          key: pixlet-0.34.0-linux-amd64

      - name: Install pixlet
        run: |
          if ! echo "5833d0711803dd6374e696a5d02462f766b299df6413486021fb4035dcc54640  pixlet.tgz" | sha256sum -c - 2>/dev/null; then
            curl -fsSL --retry 8 --retry-all-errors --connect-timeout 20 -o pixlet.tgz https://github.com/tidbyt/pixlet/releases/download/v0.34.0/pixlet_0.34.0_linux_amd64.tar.gz
            echo "5833d0711803dd6374e696a5d02462f766b299df6413486021fb4035dcc54640  pixlet.tgz" | sha256sum -c -
          fi
          tar xzf pixlet.tgz pixlet

      # One transient failure must not kill the remaining iterations -- the
      # next scheduled run can be hours away. On a render failure, re-push the
      # previous webp so the device at least keeps showing something. The run
      # fails at the end if pushes were missed, so a dead token or device id
      # shows up as a red run instead of a frozen screen.
      - name: Render and push every 15 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          VET_TOKEN: ${{ secrets.FRIEND_TIDBYT_API_TOKEN }}
          VET_DEVICE: ${{ secrets.FRIEND_TIDBYT_DEVICE_ID }}
          PASSES: ${{ inputs.passes || 22 }}
        run: |
          N="$PASSES"
          start=$(date +%s)
          chained=0; ok=0
          for i in $(seq 1 "$N"); do
            # If the Python step fails, greenpointvet.star keeps whatever frames
            # it held (the committed copy on the first pass), so a render still
            # happens -- check the log for "frames N FAILED".
            timeout 120 python3 greenpointvet/make_frames.py || echo "::warning::frames $i FAILED, keeping previous"
            if timeout 60 ./pixlet render greenpointvet/greenpointvet.star -o fresh.webp; then
              mv fresh.webp vet.webp
            else
              echo "::warning::render $i FAILED, reusing previous webp"
            fi
            if [ -f vet.webp ]; then
              # --background: without it every push jumps the device to this
              # card, restarts its rotation and breaks through night mode.
              # A push has no timeout of its own and once hung 128s.
              if timeout 90 ./pixlet push --background --api-token "$VET_TOKEN" \
                  --installation-id greenpointvet "$VET_DEVICE" vet.webp; then
                ok=$((ok + 1)); echo "push $i OK $(date -u +%H:%M)"
              else
                echo "::warning::push $i FAILED"
              fi
            fi

            # Queue the next run once a push has gone through, and again near
            # the end so the queued run checks out the latest commit. Short
            # test runs (passes < 10) don't chain.
            if [ "$N" -ge 10 ] && [ "$ok" -gt 0 ] && { [ "$chained" = 0 ] || [ "$i" -eq $((N - 1)) ]; }; then
              if gh workflow run push-greenpointvet.yml --ref "$GITHUB_REF_NAME"; then
                chained=1; echo "queued the next run"
              fi
            fi

            # Sleep to a fixed schedule, so slow passes don't drift the
            # scene changes off the quarter hour.
            if [ "$i" -lt "$N" ]; then
              left=$((start + i * 900 - $(date +%s)))
              if [ "$left" -gt 0 ]; then sleep "$left"; fi
            fi
          done

          echo "Pushes that went through: $ok of $N" >> "$GITHUB_STEP_SUMMARY"
          # A blip or two is normal; more than three misses is not.
          if [ "$ok" -lt $((N > 3 ? N - 3 : 1)) ]; then
            echo "::error::the vet device missed pushes: $ok/$N"
            exit 1
          fi
