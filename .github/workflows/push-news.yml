name: Push Greenpoint news to Tidbyt

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# GitHub throttles free-tier cron to ~1-3h in practice, so each run keeps
# itself alive for ~5.5h pushing every 10 minutes, and the next scheduled
# run queues behind it (cancel-in-progress must stay false).
concurrency:
  group: push-news
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # Runs FIRST so a later render/push failure can't skip it: this is
      # what stops GitHub from auto-disabling the schedule after 60 days.
      - name: Keepalive
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/push-news.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install pixlet
        run: curl -sL https://github.com/tidbyt/pixlet/releases/download/v0.34.0/pixlet_0.34.0_linux_amd64.tar.gz | tar xz

      # One transient failure must not kill the remaining iterations —
      # the next scheduled run can be hours away. On a render failure,
      # re-push the previous webp so the device at least stays fresh-ish.
      - name: Render and push every 10 minutes
        run: |
          for i in $(seq 1 33); do
            if ./pixlet render news/greenpoint_news.star -o fresh.webp; then
              mv fresh.webp news.webp
            else
              echo "render $i FAILED, reusing previous webp"
            fi
            if [ -f news.webp ]; then
              ./pixlet push \
                --api-token "${{ secrets.TIDBYT_API_TOKEN }}" \
                --installation-id news \
                "${{ secrets.TIDBYT_DEVICE_ID }}" news.webp \
                && echo "push $i OK $(date -u +%H:%M)" \
                || echo "push $i FAILED"
            fi
            if [ "$i" -lt 33 ]; then sleep 600; fi
          done
